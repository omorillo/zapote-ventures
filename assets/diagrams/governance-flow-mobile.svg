<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="govm-title govm-desc">
  <title id="govm-title">Vertikaler kontrollierter Aktionspfad für Agentic AI</title>
  <desc id="govm-desc">Die mobile Darstellung zeigt Identity, Policy, Human Oversight und Audit auf einem vertikalen Pfad. Falls erforderlich, wird eine menschliche Prüfung ausgelöst. Die freigegebene Aktion endet als kontrollierte Aktion.</desc>
  <defs>
    <style>
      .label{font:500 16px Inter,Arial,sans-serif;fill:#f2f5f7}.small{font:400 13px Inter,Arial,sans-serif;fill:#b6c1cc}.caption{font:500 11px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#b6c1cc}.route{fill:none;stroke:#b6c1cc;stroke-width:2}.route-active{fill:none;stroke:#c53627;stroke-width:2.5}.branch{fill:none;stroke:#b6c1cc;stroke-width:1.7;stroke-dasharray:6 7}.node{fill:#111820;stroke:#f2f5f7;stroke-width:1.6}.checkpoint{fill:#f2f5f7}.endpoint{fill:#c53627}.icon{fill:none;stroke:#f2f5f7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <path id="signal-path-mobile" class="route" d="M116 72V442"/>
  <path class="route-active" d="M116 352V442"/>

  <g id="identity-mobile" class="control-point">
    <circle class="node" cx="66" cy="72" r="30"/>
    <circle class="icon" cx="66" cy="65" r="6"/>
    <path class="icon" d="M54 85c2-8 22-8 24 0"/>
    <circle class="checkpoint" cx="116" cy="72" r="7"/>
    <text class="label" x="142" y="78">Identity</text>
  </g>

  <g id="policy-mobile" class="control-point">
    <circle class="node" cx="66" cy="162" r="30"/>
    <rect class="icon" x="57" y="148" width="18" height="25" rx="2"/>
    <path class="icon" d="M61 155h10M61 161h10M61 167h7"/>
    <circle class="checkpoint" cx="116" cy="162" r="7"/>
    <text class="label" x="142" y="168">Policy</text>
  </g>

  <g id="human-oversight-mobile" class="control-point">
    <circle class="node" cx="66" cy="252" r="30"/>
    <circle class="icon" cx="60" cy="245" r="5"/>
    <circle class="icon" cx="72" cy="248" r="4"/>
    <path class="icon" d="M50 264c1-7 17-7 19 0M67 264c1-5 12-5 14 0"/>
    <circle class="checkpoint" cx="116" cy="252" r="7"/>
    <text class="label" x="142" y="258">Human Oversight</text>
  </g>

  <g id="human-review-branch-mobile">
    <path class="branch" d="M116 252v26c0 18 15 28 34 28h22"/>
    <circle class="node" cx="184" cy="306" r="9"/>
    <text class="small" x="202" y="302"><tspan x="202">Menschliche</tspan><tspan x="202" dy="17">Prüfung</tspan></text>
  </g>

  <g id="audit-mobile" class="control-point">
    <circle class="node" cx="66" cy="352" r="30"/>
    <path class="icon" d="M55 365v-8M63 365v-15M71 365v-22M79 365v-29"/>
    <circle class="checkpoint" cx="116" cy="352" r="7"/>
    <text class="label" x="142" y="358">Audit</text>
  </g>

  <g id="controlled-action-mobile">
    <circle class="endpoint" cx="116" cy="442" r="11"/>
    <text class="label" x="142" y="448">Kontrollierte Aktion</text>
  </g>

  <text class="caption" x="180" y="526" text-anchor="middle">AUTONOMIE INNERHALB DEFINIERTER GRENZEN</text>
</svg>
